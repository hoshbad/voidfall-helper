<!--
================================================================================
  VOIDFALL COMBAT HELPER — PROTOTYPE v2
================================================================================

  KERNIDEE
  Konsolidierung der drei Entwuerfe auf der Basis von Entwurf 2 ("Stack"):
  Stepper inline, jeder Tap wirkt genau dort, wo der Finger ist, kein Modus,
  progressive Offenlegung ueber die Chip-Leiste "+ Fleet type".

  Fuenf Aenderungen tragen diese Version:

  1. Die +/- Buttons sind aus der Stepper-Reihe in die Kopfzeile der Unit
     gewandert. Dadurch steht die volle Zeilenbreite fuer die Schnellwahl frei:
     Corvette und Voidborn bekommen [1][2][3][4][5][6] (~49 px pro Button bei
     393 px Viewport), alle anderen Typen [1][2][3] (~103 px). Die alte Reihe
     [-][1]..[6][+] haette 36 px pro Button ergeben und die 44-px-Regel
     verletzt.

  2. Die alten Masken 2 und 3 sind zu einer einzigen Configuration-Maske
     verschmolzen: Invader ueber Defender auf dem Smartphone, ab 720 px
     nebeneinander. Maskenfolge jetzt 0 Profiles, 1 Type, 2 Configuration,
     3 Result. Start auf Maske 1; Maske 0 ist optional ueber die Breadcrumb
     erreichbar und typischerweise einmal pro Partie noetig.

  3. Das Datenmodell kennt keine Invader- und Defender-Datensaetze mehr,
     sondern zwei neutrale Slots plus eine Rollenzuordnung. Der Seitentausch
     bei Voidborn-Kaempfen dreht nur die Rollen um und verliert deshalb keinen
     eingetragenen Wert — obwohl er technisch ein Kampftyp-Wechsel ist und
     damit den Typwechsel-Reset bewusst umgeht.

  4. Ein Profil ist eine Person, kein Haus: Name, die Flottentypen die sie
     aufstellen kann, und ihr Technologiestand. Maske 0 verwaltet bis zu vier
     davon und speichert sie im localStorage; zugeordnet wird erst auf
     Maske 2, per Button-Leiste oben auf jeder Spielerseite. Die Zuordnung
     ist bewusst fluechtig — die Personen bleiben, die Teilnehmer eines
     einzelnen Kampfes wechseln. Ein zweiter Tap auf das aktive Profil loest
     die Zuordnung wieder, deshalb braucht die Leiste keinen Eintrag "kein
     Profil". Ein Profil waehlt nur vor: jeder Schalter bleibt frei, eine
     Abweichung bekommt einen cyanfarbenen Punkt, und was auf Maske 2
     verstellt wird, aendert das gespeicherte Profil nie.

  5. Alle sichtbaren Texte liegen in einem einzigen JSON-Block ganz oben in
     der Datei, getrennt nach terms.* (Spielbegriffe, regelwerkstreu) und
     ui.* (Prosa). Log-Saetze sind Vorlagen mit Platzhaltern. fetch() auf eine
     externe Datei scheidet aus: ueber file:// blockiert die Same-Origin-Policy
     genau das Zielszenario (Doppelklick, offline, iPhone).

  BEWUSST GEOPFERT
  - Vertikale Laenge. Die Configuration-Maske ist auf dem Smartphone deutlich
    laenger als ein Screen. Das ist der Preis dafuer, dass jeder Tap lokal
    wirkt und nichts hinter einem Modus liegt. Der Next-Button unten rechts
    federt das ab: man folgt dem Fluss von oben nach unten statt hochzuscrollen.
  - Platz fuer die Technologien. Dreier-Segmente kosten gut die dreifache
    Breite eines zyklierenden Chips. Dafuer ist jeder Zielzustand mit genau
    einem Tap erreichbar und ablesbar, statt aus einer Farbe dekodiert zu
    werden.
  - Das "dummy"-Etikett am Floating-Kurzergebnis. Es kostete rund 30 px, die
    der Reset-Button in der Kopfzeile braucht. Der Platzhalter-Charakter steht
    stattdessen ausgeschrieben auf der Result-Maske.

  KEINE KAMPFLOGIK. Zahlenblock und Kampflog auf Maske 3 sind hartcodierte
  Werte aus COMBAT-RULES.md Paragraph 8 (Worked Example). Das Urteil oben und
  das Floating-Kurzergebnis benutzen einen ausdruecklich als Platzhalter
  gekennzeichneten Summenvergleich der Fleet Power, keinen Resolver.

  SPRACHE. Standard ist Englisch. ?lang=de haengt die deutsche Prosa an;
  fehlende Schluessel fallen auf Englisch zurueck. terms.* bleibt bewusst
  einsprachig, weil mir kein deutsches Regelwerk vorliegt und Spielbegriffe
  nicht frei uebersetzt werden duerfen.
================================================================================
-->

  --invader:#e00020; --invader-hi:#ff4055; --invader-dim:#4a0a15; --invader-wash:rgba(224,0,32,.12);
  --defender:#30b0e0; --defender-hi:#6fd2f5; --defender-dim:#0a3348; --defender-wash:rgba(48,176,224,.12);
  --voidborn:#f07030; --voidborn-wash:rgba(240,112,48,.14); --fallen:#a01060; --fallen-wash:rgba(160,16,96,.14);
  --damage:#e03020; --damage-approach:#e00020; --damage-salvo:#ff5a3c;
  --absorb:#0050a0; --absorb-hi:#30b0e0; --initiative:#f0f0f0;
  --win:#3fbf7f; --lose:#e0455a; --tie:#c8a23c;
  --sector-defense:#d13f88; --starbase:#7b68e8; --shipyard:#7fa87f;
  --fleet-corvette:#f0a000; --fleet-sentry:#3fa0b4; --fleet-destroyer:#9a72e0;
  --fleet-dreadnought:#3f86d6; --fleet-carrier:#f0705a; --fleet-voidborn:#f07030;
  --tech-none-bg:#241a2a; --tech-none-line:#45354b; --tech-none-text:#8d7c95;
  --tech-basic-bg:#302030; --tech-basic-line:#f0a000; --tech-basic-text:#ffcb5c;
  --tech-improved-bg:#d0c0c0; --tech-improved-line:#ffffff; --tech-improved-text:#24101f;
  --tech-frame:#007030;

  /* ---- neu in v2 ----------------------------------------------------- */
  --next-bg:#f0a000; --next-bg-hi:#ffbe33; --next-fg:#241000; --next-line:#8a5c00;
  --back-bg:#302030; --back-fg:#f4eef6; --back-line:#55405a;
  --reset-fg:#e0455a; --reset-bg:rgba(224,69,90,.10); --reset-line:#7a2430;
  --tie-wash:rgba(200,162,60,.14); --tie-line:#c8a23c; --tie-text:#f0d48a;
  --scrim:rgba(5,3,10,.74);

  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --fs-micro:10px; --fs-label:11px; --fs-small:13px; --fs-body:15px; --fs-lead:17px;
  --fs-title:21px; --fs-display:28px; --fs-hero:40px;
  --lh-tight:1.15; --lh-normal:1.45; --ls-label:.09em; --ls-title:.04em;
  --fw-regular:400; --fw-medium:550; --fw-bold:700;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 4px 14px rgba(0,0,0,.55); --shadow-3:0 10px 34px rgba(0,0,0,.65);
  --glow-accent:0 0 0 1px var(--accent),0 0 12px rgba(240,160,0,.35);
  --glow-invader:0 0 0 1px var(--invader),0 0 12px rgba(224,0,32,.35);
  --glow-defender:0 0 0 1px var(--defender),0 0 12px rgba(48,176,224,.35);
  --tap-min:44px; --tap-comfort:52px;
  --dur-fast:110ms; --dur-base:180ms; --dur-slow:280ms; --ease:cubic-bezier(.2,.7,.3,1);
}

/* ===== Grundgeruest ====================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* height:100% auf html UND body (so in den drei Entwuerfen) macht den Body zu
   einer Box fester Viewporthoehe: die Configuration-Maske ist rund 3000 px
   hoch und war damit unscrollbar — man kam weder an die Defender-Seite noch
   an den Next-Button. Deshalb hier min-height statt height. */
html{height:100%}
body{min-height:100%;margin:0;overflow-x:hidden}
body{
  font-family:var(--font-ui);font-size:var(--fs-body);color:var(--text-1);
  background:var(--void-1);
  background-image:
    radial-gradient(120% 60% at 12% -10%,var(--nebula-a) 0%,transparent 60%),
    radial-gradient(100% 55% at 95% 8%,var(--nebula-b) 0%,transparent 62%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;margin:0}
.lbl{font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-3);font-weight:var(--fw-medium)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:1180px;margin:0 auto}

/* ===== Kopfzeile: Breadcrumb · Reset · Kurzergebnis ======================
   Breitenrechnung bei 393 px Viewport:
   4 Crumbs (182) + Reset (44) + Kurzergebnis (~80) + Gaps/Padding (40) = 346.
   ======================================================================== */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-3);padding-top:max(var(--sp-2),env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(13,7,19,.97) 60%,rgba(13,7,19,.82));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.crumb{display:flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap-min);
  min-width:var(--tap-min);padding:0 9px;border-radius:var(--r-pill);font-size:var(--fs-small);
  color:var(--text-3);white-space:nowrap;transition:background var(--dur-fast) var(--ease)}
.crumb .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);
  color:var(--text-2);font-size:var(--fs-micro);font-weight:var(--fw-bold);flex:none}
.crumb.done{color:var(--text-2)} .crumb.done .dot{background:var(--accent-dim);color:var(--accent-hi)}
.crumb[aria-current="step"]{background:var(--surface-2);color:var(--text-1)}
.crumb[aria-current="step"] .dot{background:var(--accent);color:#241000}
.crumb:disabled{opacity:.42;cursor:default}
.crumb .cname{display:none}
@media(min-width:560px){.crumb .cname{display:inline}}

.reset{flex:none;width:var(--tap-min);height:var(--tap-min);border-radius:var(--r-pill);
  display:grid;place-items:center;color:var(--reset-fg);background:var(--reset-bg);
  border:1px solid var(--reset-line)}
.reset svg{width:20px;height:20px}
.reset:active{background:rgba(224,69,90,.24)}

.mini{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;
  min-height:var(--tap-min);min-width:56px;padding:0 10px;border-radius:var(--r-pill);background:var(--surface-2);
  border:1px solid var(--line);box-shadow:var(--shadow-2)}
.mini.pulse{animation:miniPulse 480ms var(--ease)}
@keyframes miniPulse{0%{transform:scale(1)}35%{transform:scale(1.075);box-shadow:var(--glow-accent)}100%{transform:scale(1)}}
.mini .who{font-size:9px;letter-spacing:var(--ls-label);text-transform:uppercase;font-weight:var(--fw-bold);line-height:1.1}
.mini .who.inv{color:var(--invader-hi)} .mini .who.def{color:var(--defender-hi)}
.mini .who.tie{color:var(--tie)} .mini .who.na{color:var(--text-3)}
.mini .fp{display:flex;align-items:baseline;gap:3px;line-height:1}
.mini .fp b{font-family:var(--font-num);font-size:var(--fs-small);color:var(--accent)}
.mini .fp span{font-size:9px;color:var(--text-3)}

/* ===== Masken ============================================================ */
.screens{flex:1;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.pad{padding:var(--sp-4) var(--sp-3) var(--sp-4)}
h1.title{font-size:var(--fs-title);letter-spacing:var(--ls-title);margin:0 0 var(--sp-1);font-weight:var(--fw-bold)}
p.sub{margin:0 0 var(--sp-5);color:var(--text-2);font-size:var(--fs-small);line-height:var(--lh-normal)}
.notice{font-size:var(--fs-micro);color:var(--text-3);line-height:var(--lh-normal)}

/* --- Navigationszeile am Fuss einer Maske --- */
.navrow{display:flex;justify-content:flex-end;align-items:center;gap:var(--sp-2);
  padding:var(--sp-4) var(--sp-3) var(--sp-10);margin-top:auto}
.navrow.inflow{margin-top:0;padding-bottom:var(--sp-5)}
/* Der Clear-Button steht links, Next bleibt rechts. margin-right:auto statt
   space-between, damit Next auch dann rechts steht, wenn Clear mangels
   Profilen ausgeblendet ist. */
.navrow.split > .btn-reset{margin-right:auto}
.navrow.split > .btn-reset[hidden]{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  min-height:var(--tap-comfort);padding:0 var(--sp-5);border-radius:var(--r-pill);
  font-size:var(--fs-body);font-weight:var(--fw-medium);
  transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-next{background:var(--next-bg);color:var(--next-fg);font-weight:var(--fw-bold);box-shadow:var(--shadow-2)}
.btn-next:active{background:var(--next-bg-hi)}
.btn-back{background:var(--back-bg);color:var(--back-fg);border:1px solid var(--back-line)}
.btn-reset{background:var(--reset-bg);color:var(--reset-fg);border:1px solid var(--reset-line)}

/* ===== Maske 0 — Profiles ================================================
   Akkordeon statt vier ausgeklappter Karten: vier Profile mal sieben
   Technologiezeilen waeren auf 393 px eine sehr lange Maske. Genau eine
   Zeile ist offen, der Rest bleibt auf Name plus Kurzfassung zusammen.
   ======================================================================== */
.plist{display:flex;flex-direction:column;gap:var(--sp-2)}
.prow{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  overflow:hidden}
.prow.open{border-color:var(--accent-dim);box-shadow:var(--shadow-2)}
.phead{display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:left;
  min-height:var(--tap-comfort);padding:var(--sp-2) var(--sp-3)}
.phead .pn{font-size:var(--fs-body);font-weight:var(--fw-medium);flex:none;max-width:44%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.open .phead .pn{color:var(--accent-hi)}
.phead .ps{flex:1;min-width:0;font-size:var(--fs-micro);color:var(--text-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.phead .chev{flex:none;color:var(--text-3);font-size:var(--fs-lead);
  transition:transform var(--dur-fast) var(--ease)}
.prow.open .phead .chev{transform:rotate(90deg);color:var(--accent)}
.pbody{padding:0 var(--sp-3) var(--sp-3);border-top:1px solid var(--line-soft)}
.pbody .field{margin-top:var(--sp-3)}
.pbody .pnote{font-size:var(--fs-micro);color:var(--text-3);line-height:var(--lh-normal);margin:5px 0 0}

.pname-in{width:100%;min-height:var(--tap-comfort);padding:0 var(--sp-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  color:var(--text-1);font-family:inherit;font-size:var(--fs-body);font-weight:var(--fw-medium)}
.pname-in:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow-accent)}
.pwarn{font-size:var(--fs-micro);color:var(--reset-fg);line-height:var(--lh-normal);margin:5px 0 0}
.pwarn[hidden]{display:none}

.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap-min);padding:0 var(--sp-3);
  border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line-soft);
  color:var(--text-3);font-size:var(--fs-small);
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.chip svg{width:18px;height:18px;opacity:.5}
.chip[aria-pressed="true"]{background:var(--surface-4);border-color:var(--accent);color:var(--text-1);
  font-weight:var(--fw-medium)}
.chip[aria-pressed="true"] svg{opacity:1}
.chip:active{transform:scale(.96)}

.pgroup{margin-top:var(--sp-3);padding-top:var(--sp-2);border-top:1px dashed var(--line-soft)}
.pgroup > .lbl{display:block;margin-bottom:6px}
.pdel{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:var(--tap-min);
  margin-top:var(--sp-4);border-radius:var(--r-pill);background:var(--reset-bg);color:var(--reset-fg);
  border:1px solid var(--reset-line);font-size:var(--fs-small)}

.padd{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);width:100%;
  min-height:var(--tap-comfort);border-radius:var(--r-lg);background:transparent;
  border:1px dashed var(--line);color:var(--accent-hi);font-size:var(--fs-body);
  font-weight:var(--fw-medium)}
.padd svg{width:20px;height:20px}
.padd:active{background:var(--surface-1)}
.pempty,.phint{font-size:var(--fs-small);color:var(--text-3);line-height:var(--lh-normal);margin:0}
.nostore{display:block;border:1px solid var(--tie-line);background:var(--tie-wash);color:var(--tie-text);
  border-radius:var(--r-md);padding:var(--sp-3);font-size:var(--fs-small);line-height:var(--lh-normal);margin:0}

/* ===== Maske 1 — Type ==================================================== */
.types{display:flex;flex-direction:column;gap:var(--sp-2)}
.type{display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:left;min-height:76px;
  padding:var(--sp-3) var(--sp-4);background:var(--surface-1);border:1px solid var(--line-soft);
  border-radius:var(--r-lg);transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.type:active{transform:scale(.985);background:var(--surface-2)}
.type .sig{width:44px;height:44px;flex:none;border-radius:var(--r-md);display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line)}
.type .sig svg{width:26px;height:26px}
.type .txt{flex:1;min-width:0}
.type .txt b{display:block;font-size:var(--fs-body);font-weight:var(--fw-medium)}
.type .txt small{display:block;color:var(--text-3);font-size:var(--fs-micro);margin-top:2px;line-height:var(--lh-normal)}
.type .go{color:var(--text-3);font-size:var(--fs-lead)}
.type[data-t="pvp"]{border-left:3px solid var(--invader)}
.type[data-t="pvv"]{border-left:3px solid var(--voidborn)}
.type[data-t="skirmish"]{border-left:3px solid var(--defender)}
.type[data-t="fallen"]{border-left:3px solid var(--fallen)}
.type.sel{border-color:var(--accent);box-shadow:var(--glow-accent)}

/* ===== Maske 2 — Configuration =========================================== */
.typebar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  padding:var(--sp-3) var(--sp-3) 0}
.typebar .now{flex:1;min-width:0;font-size:var(--fs-small);color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typebar .now b{color:var(--text-1);font-weight:var(--fw-medium)}
.swap{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap-min);padding:0 var(--sp-3);
  border-radius:var(--r-pill);border:1px solid var(--accent-dim);background:var(--surface-2);
  color:var(--accent-hi);font-size:var(--fs-small);font-weight:var(--fw-medium)}
.swap svg{width:18px;height:18px}
.swap:active{background:var(--surface-3)}
.typebar .swaphint{flex-basis:100%;font-size:var(--fs-micro);color:var(--text-3);line-height:var(--lh-normal)}

.duo{display:flex;flex-direction:column}
.side{display:flex;flex-direction:column;flex:1;min-width:0}
.sidehead{position:sticky;top:60px;z-index:20;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-3);background:rgba(13,7,19,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft)}
.sidehead .badge{font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase;
  font-weight:var(--fw-bold);padding:5px 10px;border-radius:var(--r-sm);flex:none}
.side.inv .sidehead .badge{background:var(--invader-wash);color:var(--invader-hi);border:1px solid var(--invader)}
.side.def .sidehead .badge{background:var(--defender-wash);color:var(--defender-hi);border:1px solid var(--defender)}
.sidehead .ctx{font-size:var(--fs-small);color:var(--text-2);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.sidehead .tot{font-family:var(--font-num);font-size:var(--fs-lead);color:var(--accent);flex:none}
.sidehead .tot small{font-size:var(--fs-micro);color:var(--text-3);margin-left:3px}
.sidebody{padding:var(--sp-3)}

/* --- Profilleiste ganz oben auf jeder Spielerseite ----------------------
   Buttons statt Select: die Zuordnung ist der haeufigste Tap der Maske und
   soll ohne Umweg ueber ein Auswahlmenue erreichbar sein. Bei vier Profilen
   auf 393 px umbrechen sie zu zwei Reihen — lesbarer als vier gequetschte
   Spalten.                                                                 */
.profbar{margin-bottom:var(--sp-3)}
.profbar > .lbl{display:block;margin-bottom:6px}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{flex:1 1 42%;min-width:0;min-height:var(--tap-min);padding:0 var(--sp-3);
  border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line-soft);
  color:var(--text-2);font-size:var(--fs-small);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.pbtn:active{transform:scale(.97)}
/* Leerer Platz: sichtbar als Raster, aber erkennbar nichts zum Antippen. */
.pbtn.empty{border-style:dashed;background:transparent;color:var(--text-3);opacity:.42;cursor:default}
.pbtn.empty:active{transform:none}
.side.inv .pbtn[aria-pressed="true"]{background:var(--invader-wash);border-color:var(--invader);
  color:var(--invader-hi);font-weight:var(--fw-bold)}
.side.def .pbtn[aria-pressed="true"]{background:var(--defender-wash);border-color:var(--defender);
  color:var(--defender-hi);font-weight:var(--fw-bold)}
.profbar .hint{font-size:var(--fs-micro);color:var(--text-3);line-height:var(--lh-normal);margin:6px 0 0}

.card{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:var(--sp-3);margin-bottom:var(--sp-3)}
.card:last-child{margin-bottom:0}
.card > .lbl{display:block;margin-bottom:var(--sp-2)}

/* --- Flottenzeile: Kopf mit Wert und +/- , darunter volle Schnellwahl ---
   Gerechnete Innenbreite bei 393 px Viewport: 319 px.
   Corvette 6 Buttons: (319 - 5*5) / 6 = 49 px.  Andere 3 Buttons: 103 px.   */
.unit{border-radius:var(--r-md);background:var(--surface-2);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-2)}
.unit:last-child{margin-bottom:0}
.unit.zero{background:transparent;border:1px dashed var(--line-soft)}
.uhead{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap-min)}
.uhead .fi{width:24px;height:24px;flex:none;display:grid;place-items:center}
.uhead .fi svg{width:24px;height:24px}
.uhead .fn{flex:1;font-size:var(--fs-small);font-weight:var(--fw-medium);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uhead .uv{font-family:var(--font-num);font-size:26px;font-weight:var(--fw-bold);color:var(--accent);
  line-height:1;min-width:28px;text-align:right;flex:none}
.unit.zero .uhead .uv{color:var(--text-3)}
.uhead .pm{width:var(--tap-min);height:var(--tap-min);flex:none;border-radius:var(--r-sm);
  background:var(--surface-4);color:var(--accent-hi);font-size:22px;font-weight:var(--fw-bold);
  display:grid;place-items:center;transition:background var(--dur-fast) var(--ease)}
.uhead .pm:active{background:var(--accent);color:#241000}
.uhead .pm:disabled{opacity:.3}
.uhead .rm{width:var(--tap-min);height:var(--tap-min);flex:none;border-radius:var(--r-sm);
  color:var(--text-3);font-size:var(--fs-lead)}

.quick{display:flex;gap:5px;margin-top:6px}
.quick button{flex:1;min-width:0;min-height:var(--tap-comfort);border-radius:var(--r-md);
  background:var(--surface-3);border:1px solid var(--line-soft);
  font-family:var(--font-num);font-size:var(--fs-lead);color:var(--text-2);
  transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.quick button:active{transform:scale(.93)}
.quick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#241000;font-weight:var(--fw-bold)}

/* --- angedockte Technologien --- */
.attach{margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px dashed var(--line-soft)}
.attach > .lbl{display:block;margin-bottom:6px}
/* Jede Technologie ist ein Block: die Zeile mit den Schaltern, darunter der
   Erklaersatz in Kleinschrift. Der Satz gehoert zur Zeile, deshalb traegt der
   Block den Abstand nach unten und die Zeile selbst keinen mehr.            */
.tblock{margin-bottom:var(--sp-2)}
.tblock:last-child{margin-bottom:0}
.trow{display:flex;align-items:center;gap:var(--sp-2)}
.trow .tn{flex:1;min-width:0;font-size:var(--fs-small);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tri{display:flex;gap:3px;flex:none;background:var(--surface-1);padding:3px;border-radius:var(--r-md);
  border:1px solid var(--line-soft)}
.tri button{
  min-height:var(--tap-min);min-width:44px;padding:0 8px;border-radius:7px;
  font-size:var(--fs-micro);letter-spacing:.07em;text-transform:uppercase;color:var(--tech-none-text);
  white-space:nowrap;transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.tri button[aria-pressed="true"][data-v="0"]{background:var(--tech-none-bg);color:var(--text-2);
  box-shadow:inset 0 0 0 1px var(--tech-none-line)}
.tri button[aria-pressed="true"][data-v="1"]{background:var(--tech-basic-bg);color:var(--tech-basic-text);
  box-shadow:inset 0 0 0 1px var(--tech-basic-line)}
.tri button[aria-pressed="true"][data-v="2"]{background:var(--tech-improved-bg);color:var(--tech-improved-text);
  box-shadow:inset 0 0 0 1px var(--tech-improved-line);font-weight:var(--fw-bold)}
.trow.deviates .tn::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent-2);margin-left:6px;vertical-align:middle}

/* --- flaches Steuerelement, Label auf eigener Zeile ----------------------
   Drei Buttons auf 319 px Innenbreite: (319 - 8 Padding - 8 Gaps) / 3.     */
.field{margin-bottom:var(--sp-3)}
.field:last-child{margin-bottom:0}
.field > .lbl{display:flex;align-items:center;gap:6px;margin-bottom:6px}
/* Der Erklaersatz sitzt unter Segmenten wie unter Technologiezeilen und ist
   deshalb bewusst nicht auf .field beschraenkt.                             */
.expl{font-size:var(--fs-micro);color:var(--text-3);margin:5px 0 0;line-height:var(--lh-normal)}
.seg{display:flex;gap:4px;background:var(--surface-1);padding:3px;border-radius:var(--r-md);border:1px solid var(--line-soft)}
.seg button{flex:1;min-width:0;min-height:var(--tap-min);border-radius:7px;font-size:var(--fs-small);
  color:var(--text-3);white-space:nowrap;transition:background var(--dur-fast) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text-1);font-weight:var(--fw-medium)}

/* --- Deep Space Missiles: Stufe oben, Folgefrage darunter -----------------
   Die Folgefrage ruecken Einzug und Kante ein: sie haengt an der Stufe und
   ist keine eigenstaendige Einstellung.                                     */
.dsmbox{margin-bottom:var(--sp-2)}
.dsmbox:last-child{margin-bottom:0}
.dsmbox .sub{margin:var(--sp-2) 0 0;padding-left:var(--sp-3);border-left:2px solid var(--line-soft)}

/* --- Advanced --- */
details.adv{margin-top:var(--sp-2);border-top:1px dashed var(--line-soft);padding-top:var(--sp-1)}
details.adv summary{list-style:none;display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap-min);
  cursor:pointer;font-size:var(--fs-small);color:var(--text-2)}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"▸";color:var(--accent);transition:transform var(--dur-fast)}
details.adv[open] summary::before{transform:rotate(90deg)}
.switch{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--tap-min);width:100%;text-align:left;
  margin-bottom:var(--sp-3)}
.switch .tr{width:46px;height:28px;border-radius:var(--r-pill);background:var(--surface-3);flex:none;
  position:relative;border:1px solid var(--line)}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--text-2);transition:transform var(--dur-fast) var(--ease)}
.switch[aria-pressed="true"] .tr{background:var(--accent-dim);border-color:var(--accent)}
.switch[aria-pressed="true"] .tr::after{transform:translateX(18px);background:var(--accent-hi)}
.switch .sl{font-size:var(--fs-small);flex:1;line-height:var(--lh-normal)}

.fixedside{padding:var(--sp-6) var(--sp-3);text-align:center}
.fixedside .big{font-family:var(--font-num);font-size:var(--fs-hero);color:var(--sector-defense);line-height:1}
.fixedside .lbl{display:block;margin-top:var(--sp-1)}
.fixedside p{color:var(--text-2);font-size:var(--fs-small);line-height:var(--lh-normal);max-width:36ch;margin:var(--sp-3) auto 0}

/* ===== Maske 3 — Result ================================================== */
.result{padding:var(--sp-4) var(--sp-3) 0}
.verdict{border-radius:var(--r-lg);padding:var(--sp-5) var(--sp-4);text-align:center;margin-bottom:var(--sp-3)}
.verdict.win{border:1px solid var(--win);background:linear-gradient(180deg,rgba(63,191,127,.16),rgba(63,191,127,.04))}
.verdict.win .who{color:var(--win)}
.verdict.tie{border:1px solid var(--tie-line);background:linear-gradient(180deg,var(--tie-wash),rgba(200,162,60,.03))}
.verdict.tie .who{color:var(--tie)}
.verdict.na{border:1px dashed var(--line);background:transparent}
.verdict.na .who{color:var(--text-3)}
.verdict .who{font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase;font-weight:var(--fw-bold)}
.verdict h2{margin:var(--sp-2) 0 var(--sp-1);font-size:var(--fs-display);letter-spacing:var(--ls-title)}
.verdict .rem{color:var(--text-2);font-size:var(--fs-small)}
.verdict .rem b{font-family:var(--font-num);color:var(--accent);font-size:var(--fs-lead)}
.verdict .pnote{margin-top:var(--sp-3);font-size:var(--fs-micro);color:var(--text-3);line-height:var(--lh-normal)}
.tiehint{display:flex;gap:var(--sp-2);align-items:flex-start;border:1px solid var(--tie-line);
  background:var(--tie-wash);border-radius:var(--r-md);padding:var(--sp-3);margin-bottom:var(--sp-3);
  color:var(--tie-text);font-size:var(--fs-small);line-height:var(--lh-normal)}
.tiehint svg{width:20px;height:20px;flex:none;margin-top:1px}
.fpbars{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.fpbar{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:var(--sp-3)}
.fpbar .lbl{display:block;margin-bottom:6px}
.fpbar.inv{border-left:3px solid var(--invader)} .fpbar.def{border-left:3px solid var(--defender)}
.fpbar .v{font-family:var(--font-num);font-size:var(--fs-display);line-height:1}
.fpbar.inv .v{color:var(--invader-hi)} .fpbar.def .v{color:var(--defender-hi)}
.fpbar .d{font-size:var(--fs-micro);color:var(--text-3);margin-top:4px}
.log{border-top:1px solid var(--line-soft);padding-top:var(--sp-4)}
.log h3{font-size:var(--fs-lead);margin:0 0 var(--sp-3);letter-spacing:var(--ls-title)}
.step{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--r-md);margin-bottom:var(--sp-2);overflow:hidden}
.step > summary{list-style:none;display:flex;align-items:center;gap:var(--sp-3);min-height:var(--tap-comfort);
  padding:var(--sp-2) var(--sp-3);cursor:pointer}
.step > summary::-webkit-details-marker{display:none}
.step .sname{flex:1;font-size:var(--fs-small);font-weight:var(--fw-medium)}
.step .sfp{display:flex;align-items:center;gap:6px;font-family:var(--font-num);font-size:var(--fs-small)}
.step .sfp .i{color:var(--invader-hi)} .step .sfp .d{color:var(--defender-hi)} .step .sfp .sep{color:var(--text-3)}
.step .chev{color:var(--text-3);transition:transform var(--dur-fast)}
.step[open] .chev{transform:rotate(90deg)}
.step .body{padding:var(--sp-3);border-top:1px solid var(--line-soft)}
.calc{display:flex;flex-direction:column;gap:var(--sp-2)}
.line{display:flex;align-items:flex-start;gap:var(--sp-2);font-size:var(--fs-small);line-height:var(--lh-normal)}
.line .pip{width:8px;height:8px;border-radius:2px;flex:none;margin-top:6px}
.line .pip.dmg{background:var(--damage)} .line .pip.abs{background:var(--absorb-hi)}
.line .pip.ini{background:var(--initiative)} .line .pip.res{background:var(--accent)}
.line span{flex:1;color:var(--text-2)} .line b{color:var(--text-1);font-family:var(--font-num)}

/* ===== Reset-Rueckfrage ================================================== */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:var(--sp-4)}
.scrim.on{display:flex}
.dialog{width:100%;max-width:360px;background:var(--surface-sheet);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--sp-5) var(--sp-4);box-shadow:var(--shadow-3)}
.dialog h2{margin:0 0 var(--sp-2);font-size:var(--fs-lead);letter-spacing:var(--ls-title)}
.dialog p{margin:0 0 var(--sp-5);color:var(--text-2);font-size:var(--fs-small);line-height:var(--lh-normal)}
.dialog .row{display:flex;gap:var(--sp-2);justify-content:flex-end}

/* ===== Tablet-Breakpoint ================================================= */
@media(min-width:720px){
  .duo{flex-direction:row}
  .duo > .side{flex:1 1 50%;border-right:1px solid var(--line-soft)}
  .duo > .side:last-child{border-right:0}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
  /* Die Profilliste bleibt einspaltig: ein Akkordeon in zwei Spalten laesst
     die Nachbarzeilen beim Aufklappen springen. */
  .plist{max-width:620px}
  /* Die Profil-Buttons bekommen hier bewusst KEINE eigene Regel: ab 720 px
     steht das Seitenpanel in halber Breite und ist damit genauso schmal wie
     auf dem Telefon. Vier Namen in eine Reihe zu zwingen schnitt sie ab. */
  .pad{padding:var(--sp-6) var(--sp-5) var(--sp-4)}
  .result{padding:var(--sp-5) var(--sp-5) 0}
  .navrow{padding-left:var(--sp-5);padding-right:var(--sp-5)}
  .typebar{padding:var(--sp-4) var(--sp-5) 0}
  .tri button{min-width:56px}
}
</style>

<script>
"use strict";

/* ===========================================================================
   1 — TEXTE
   Ein t(key, params) mit Fallback auf Englisch. Die Sprache kommt aus
   ?lang=xx; ohne Parameter Englisch. Der Fallback erlaubt es, eine Sprache
   unvollstaendig zu pflegen — "de" enthaelt deshalb kein terms.*, weil mir
   kein deutsches Regelwerk vorliegt und Spielbegriffe nicht frei uebersetzt
   werden duerfen.
   ======================================================================== */
const STRINGS = JSON.parse(document.getElementById("strings").textContent);

/* Sprache umstellen: diese eine Zeile auf "de" aendern. ?lang=de in der URL
   geht auch, ist per Doppelklick aber unbequem — deshalb die Konstante. */
const DEFAULT_LANG = "en";
const LANG = (new URLSearchParams(location.search).get("lang") || DEFAULT_LANG).toLowerCase();

function raw(key, lang){
  const parts = key.split(".");
  let node = STRINGS[lang];
  if(!node) return null;
  node = node[parts[0]];
  if(!node) return null;
  const rest = parts.slice(1).join(".");
  return typeof node[rest] === "string" ? node[rest] : null;
}
function t(key, params){
  let s = raw(key, LANG);
  if(s === null) s = raw(key, "en");
  if(s === null) return "[" + key + "]";
  if(params) for(const k in params) s = s.split("{" + k + "}").join(params[k]);
  return s;
}
document.title = t("ui.app.title") + " — Prototype v2";

/* ===========================================================================
   2 — STAMMDATEN
   ======================================================================== */
const FLEETS = {
  corvette:   {icon:"i-corvette",    color:"--fleet-corvette"},
  sentry:     {icon:"i-sentry",      color:"--fleet-sentry"},
  destroyer:  {icon:"i-destroyer",   color:"--fleet-destroyer"},
  dreadnought:{icon:"i-dreadnought", color:"--fleet-dreadnought"},
  carrier:    {icon:"i-carrier",     color:"--fleet-carrier"}
};
const FLEET_KEYS = Object.keys(FLEETS);

/* Technologien als Dreier-Segmente. null = dieser Zustand existiert nicht und
   faellt aus dem Segment heraus; so degradiert Energy Cells sauber auf zwei
   und der Destroyer-Tile ebenfalls auf zwei Buttons.

   note ist der Erklaersatz unter der Zeile: eine Zeile, Kleinschrift, nur als
   Gedaechtnisstuetze. Er steht an jeder Technologie, auf beiden Masken.

   Deep Space Missiles steht hier gleichberechtigt neben den anderen: die
   Stufe sagt nur, ob und wie ausgebaut man die Technologie besitzt. Ob sie
   im konkreten Kampf ueberhaupt greift — benachbarte Shipyard/Starbase,
   ausgegebene Energy — ist keine Eigenschaft der Person und haengt deshalb
   als Folgefrage an der Aufstellung (dsmEnergy, dsmAdjacent in blank()).   */
const TECH = {
  targeting: {label:"terms.targeting",     states:["terms.none","terms.basic","terms.improved"], note:"ui.x.targeting"},
  shields:   {label:"terms.shields",       states:["terms.none","terms.basic","terms.improved"], note:"ui.x.shields"},
  torpedoes: {label:"terms.torpedoes",     states:["terms.none","terms.basic","terms.improved"], note:"ui.x.torpedoes"},
  dsm:       {label:"terms.dsm",           states:["terms.none","terms.basic","terms.improved"], note:"ui.x.dsm"},
  destroyers:{label:"terms.destroyerTile", states:[null,"terms.basic","terms.improved"],         note:"ui.x.destroyers"},
  drones:    {label:"terms.drones",        states:["terms.none","terms.basic","terms.improved"], note:"ui.x.drones"},
  energy:    {label:"terms.energyCells",   states:["terms.none",null,"terms.owned"],             note:"ui.x.energy"}
};

/* Improved Deep Space Missiles zaehlt die benachbarten Sektoren mit Shipyard
   oder Starbase, gedeckelt bei zwei. 0 gehoert dazu: Improved besitzen und
   keinen passenden Nachbarn haben ist ein regulaerer Fall.                  */
const DSM_ADJ = [0,1,2];

/* Ein Profil ist eine Person, kein Haus: Name, die Flottentypen die sie
   aufstellen kann, und ihr Technologiestand. Corvettes stehen jedem zu und
   sind deshalb nicht waehlbar, sondern implizit.                            */
const MAX_PLAYERS = 4;
const NAME_MAX    = 14;
const OPT_FLEETS  = FLEET_KEYS.filter(f => f !== "corvette");

/* Erlaubte Werte je Technologie, direkt aus TECH abgeleitet — sonst driftet
   die Validierung geladener Profile von der UI weg. Ergibt destroyers [1,2]
   (kein "None") und energy [0,2].                                           */
const TECH_VALUES = {};
Object.keys(TECH).forEach(k => {
  TECH_VALUES[k] = TECH[k].states.map((s,i) => s === null ? -1 : i).filter(i => i >= 0);
});
const TECH_KEYS = Object.keys(TECH_VALUES);

/* Die Reihenfolge im Profil-Editor. Welche davon im Kampf zaehlen, haengt an
   der Seite — besitzen tut die Person alle. Deshalb speichert das Profil
   auch alle, und erst Maske 2 blendet aus, was fuer die Rolle nicht gilt.   */
const TECH_GROUPS = [
  {label:"ui.p.techBoth", keys:["targeting","shields","torpedoes","dsm"]},
  {label:"ui.p.techInv",  keys:["destroyers","drones"]},
  {label:"ui.p.techDef",  keys:["energy"]}
];

function blankTech(){
  return {targeting:0, shields:0, torpedoes:0, destroyers:1, dsm:0, drones:0, energy:0};
}

const TYPES = ["pvp","pvv","skirmish","fallen"];
const TYPE_META = {
  pvp:      {icon:"i-pvp",      color:"--invader-hi"},
  pvv:      {icon:"i-voidborn", color:"--voidborn"},
  skirmish: {icon:"i-voidborn", color:"--defender-hi"},
  fallen:   {icon:"i-fallen",   color:"--fallen"}
};

/* ===========================================================================
   3 — ZUSTAND
   Kein Invader-/Defender-Datensatz, sondern zwei neutrale Slots p und q plus
   die Zuordnung S.roles. Der Seitentausch dreht nur diese Zuordnung um (und
   den Kampftyp zwischen pvv und skirmish) — deshalb ist er verlustfrei und
   umgeht den Typwechsel-Reset bewusst.
   ======================================================================== */
function blank(){
  return {
    corvette:0, sentry:0, destroyer:0, dreadnought:0, carrier:0, voidborn:0,
    sectorDefenses:0, starbases:0,
    tech:blankTech(),
    /* Einsatz der Deep Space Missiles im konkreten Kampf, nicht im Profil:
       Basic gibt 1 Energy aus, Improved zaehlt die Nachbarsektoren.        */
    dsmEnergy:false, dsmAdjacent:0,
    returnTrade:false, bombard:0
  };
}
const S = {
  screen: 1,
  combatType: null,
  data:    {p:blank(), q:blank()},
  players: [],                        // persistent, siehe Abschnitt 5
  profile: {p:null, q:null},          // Profil-Id je Slot — fluechtig, wird nie gespeichert
  editing: null,                      // welche Profilzeile auf Maske 0 aufgeklappt ist
  shown:   {p:["corvette"], q:["corvette"]},
  roles:   {inv:"p", def:"q"},
  advOpen: {p:false, q:false}
};

const slotOf     = role => S.roles[role];
const D          = role => S.data[slotOf(role)];
const roleOfSlot = slot => S.roles.inv === slot ? "inv" : "def";
const playerById = id => S.players.find(p => p.id === id) || null;
const playerOf   = slot => playerById(S.profile[slot]);
const profOf     = role => playerOf(slotOf(role));

const isVoidborn = role =>
  (S.combatType === "pvv" && role === "def") || (S.combatType === "skirmish" && role === "inv");
const isFallen   = role => S.combatType === "fallen" && role === "def";
const isPlayer   = role => !isVoidborn(role) && !isFallen(role);
const canSwap    = () => S.combatType === "pvv" || S.combatType === "skirmish";

const FP_KEYS = FLEET_KEYS.concat(["voidborn"]);
const totalFP = role => FP_KEYS.reduce((a,k) => a + D(role)[k], 0);

/* ===========================================================================
   4 — MINI-HELFER
   ======================================================================== */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html != null) n.innerHTML = html;
  return n;
}
function btn(cls, html, onClick, attrs){
  const b = el("button", cls, html);
  if(attrs) for(const k in attrs) b.setAttribute(k, attrs[k]);
  b.addEventListener("click", onClick);
  return b;
}
const icon = (id, color) => `<svg${color ? ` style="color:var(${color})"` : ""}><use href="#${id}"/></svg>`;
const roleName = role => t(role === "inv" ? "terms.invader" : "terms.defender");
/* Profilnamen kommen vom Nutzer und laufen durch innerHTML — hier maskieren. */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===========================================================================
   5 — PROFILE: SPEICHERN, ANWENDEN, ABWEICHUNG
   Ein Profil ist Stammdatensatz einer Person und liegt im localStorage. Die
   Zuordnung Profil→Slot ist dagegen bewusst fluechtig: die Teilnehmer eines
   Kampfes wechseln, die Personen nicht.

   Das Profil waehlt nur vor. Jeder Schalter bleibt auf Maske 2 frei; eine
   Abweichung wird mit einem cyanfarbenen Punkt markiert. Die Richtung ist
   einseitig — was auf Maske 2 verstellt wird, aendert das Profil nie.
   ======================================================================== */
const STORE_KEY = "voidfall.profiles.v1";

/* Safari verweigert localStorage auf file://-URLs; schon der Zugriff auf das
   Objekt kann werfen. Faellt der Speicher aus, laeuft alles weiter, die
   Profile leben dann nur fuer diese Sitzung — Maske 0 sagt das dann auch. */
let storeOk = true;

function loadPlayers(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return [];
    const d = JSON.parse(raw);
    if(!d || d.v !== 1 || !Array.isArray(d.players)) return [];
    return d.players.map(sanePlayer).filter(Boolean).slice(0, MAX_PLAYERS);
  }catch(e){
    storeOk = false;
    return [];
  }
}
function savePlayers(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({v:1, players:S.players}));
  }catch(e){
    storeOk = false;
  }
}

/* Fremde oder veraltete Daten nie ungeprueft uebernehmen: ein Wert, den das
   Segment gar nicht kennt, wuerde eine Zeile ohne sichtbare Auswahl zeigen. */
function sanePlayer(p){
  if(!p || typeof p.name !== "string") return null;
  const name = p.name.trim().slice(0, NAME_MAX);
  if(!name) return null;
  const tech = blankTech();
  TECH_KEYS.forEach(k => {
    const v = p.tech ? p.tech[k] : undefined;
    if(TECH_VALUES[k].includes(v)) tech[k] = v;
  });
  /* Bis zur Umstellung trug dsm die Zahl der Nachbarsektoren mit: 2 war
     "Imp 1", 3 war "Imp 2". Beides ist heute schlicht Improved.            */
  if(p.tech && p.tech.dsm === 3) tech.dsm = 2;
  const fleets = Array.isArray(p.fleets) ? OPT_FLEETS.filter(f => p.fleets.includes(f)) : [];
  return {id: typeof p.id === "string" && p.id ? p.id : newId(), name, fleets, tech};
}
let idSeq = 0;
const newId = () => "pl" + (Date.now().toString(36)) + (idSeq++).toString(36);

/* Anwenden ueberschreibt Technologien und Flottentypen der Seite. Ohne Profil
   wird nichts geloescht: die Zuordnung zu loesen ist zerstoerungsfrei und
   laesst nur wieder alle Flottentypen zur Auswahl zu.                       */
function applyProfile(slot){
  const pl = playerOf(slot), d = S.data[slot];
  if(!pl){
    S.shown[slot] = ["corvette"].concat(
      OPT_FLEETS.filter(f => d[f] > 0 || S.shown[slot].includes(f)));
    return;
  }
  d.tech = blankTech();
  Object.assign(d.tech, pl.tech);
  OPT_FLEETS.forEach(f => { if(!pl.fleets.includes(f)) d[f] = 0; });
  S.shown[slot] = ["corvette"].concat(OPT_FLEETS.filter(f => pl.fleets.includes(f)));
}

function setProfile(slot, id){
  S.profile[slot] = (S.profile[slot] === id) ? null : id;   // zweiter Tap loest die Zuordnung
  applyProfile(slot);
  renderConfig(); bump();
}

const deviates = (role, key) => {
  const pl = profOf(role);
  if(!pl) return false;
  return pl.tech[key] !== D(role).tech[key];
};

/* Ein Profil ohne Namen ist keins: es verschwindet, sobald die Zeile
   zugeklappt wird oder die Maske verlassen wird.                            */
function commitProfiles(){
  const before = S.players.length;
  S.players.forEach(p => { p.name = p.name.trim(); });
  S.players = S.players.filter(p => p.name !== "");
  if(S.players.length !== before){
    ["p","q"].forEach(s => { if(!playerById(S.profile[s])) S.profile[s] = null; });
    if(!playerById(S.editing)) S.editing = null;
  }
  savePlayers();
}

/* ===========================================================================
   6 — NAVIGATION
   ======================================================================== */
const STEPS = [0,1,2,3];
(function buildCrumbs(){
  const nav = $("#crumbs");
  STEPS.forEach(i => {
    const name = t("ui.step." + i);
    nav.append(btn("crumb", `<span class="dot">${i}</span><span class="cname">${name}</span>`,
      () => go(i), {"data-go":i, "aria-label":t("ui.step.goto",{name})}));
  });
})();

function go(n){
  if(n >= 2 && !S.combatType) n = 1;
  if(S.screen === 0 && n !== 0) commitProfiles();
  S.screen = n;
  $$(".screen").forEach(s => s.classList.toggle("on", +s.dataset.screen === n));
  $$(".crumb").forEach(c => {
    const i = +c.dataset.go;
    c.toggleAttribute("disabled", i >= 2 && !S.combatType);
    c.classList.toggle("done", i < n && i !== 0);
    if(i === n) c.setAttribute("aria-current","step"); else c.removeAttribute("aria-current");
  });
  if(n === 0) renderProfiles();
  if(n === 2) renderConfig();
  if(n === 3) renderResult();
  window.scrollTo(0,0);
}
$("#mini").addEventListener("click", () => go(3));

/* ===========================================================================
   7 — MASKE 0 · PROFILES
   ======================================================================== */
$("#s0title").textContent = t("ui.p.title");
$("#s0sub").textContent   = t("ui.p.sub");
$("#next0").innerHTML     = t("ui.nav.next") + icon("i-arrow");
$("#next0").addEventListener("click", () => go(1));
$("#clear0").textContent  = t("ui.p.clear");
$("#clear0").addEventListener("click", () => askConfirm(
  t("ui.p.clearTitle"), t("ui.p.clearBody", {n:S.players.length}), t("ui.p.clearConfirm"),
  () => {
    S.players = [];
    S.profile = {p:null, q:null};
    S.editing = null;
    savePlayers();
    applyProfile("p"); applyProfile("q");
    renderProfiles(); bump();
  }));

/* Kurzfassung fuer die zugeklappte Zeile: erst die Flottentypen, dann die
   Technologien mit einem Wert ueber dem Grundzustand.                       */
function profSummary(pl){
  const bits = pl.fleets.map(f => t("terms." + f));
  TECH_KEYS.forEach(k => {
    const base = TECH_VALUES[k][0];
    if(pl.tech[k] > base) bits.push(t(TECH[k].label));
  });
  return bits.length ? bits.join(" · ") : t("ui.p.sumNothing");
}

function renderProfiles(){
  const box = $("#profBox");
  box.innerHTML = "";
  if(!storeOk) box.append(el("p","nostore", t("ui.p.noStore")));

  S.players.forEach(pl => box.append(profileRow(pl)));

  if(!S.players.length) box.append(el("p","pempty", t("ui.p.empty")));
  if(S.players.length < MAX_PLAYERS){
    box.append(btn("padd", icon("i-plus") + t("ui.p.add"), addPlayer));
  } else {
    box.append(el("p","phint", t("ui.p.full")));
  }
  $("#clear0").hidden = !S.players.length;
}

function addPlayer(){
  commitProfiles();
  if(S.players.length >= MAX_PLAYERS) return;
  const pl = {id:newId(), name:"", fleets:[], tech:blankTech()};
  S.players.push(pl);
  S.editing = pl.id;
  renderProfiles();
  const inp = $(".prow.open .pname-in");
  if(inp) inp.focus();
}

function profileRow(pl){
  const open = S.editing === pl.id;
  const w = el("div", "prow" + (open ? " open" : ""));

  const head = btn("phead",
    `<span class="pn">${esc(pl.name || t("ui.p.unnamed"))}</span>
     <span class="ps">${esc(profSummary(pl))}</span>
     <span class="chev">›</span>`,
    () => {
      S.editing = open ? null : pl.id;
      commitProfiles();
      renderProfiles();
    },
    {"aria-expanded":String(open), "aria-label":t("ui.p.edit", {name: pl.name || t("ui.p.unnamed")})});
  w.append(head);
  if(!open) return w;

  const body = el("div","pbody");

  /* ---- Name -------------------------------------------------------------
     Tippen darf nicht neu rendern, sonst verliert das Feld den Fokus nach
     jedem Zeichen. Kopfzeile und Warnung werden direkt nachgezogen.        */
  const nf = el("div","field");
  nf.append(el("span","lbl", t("ui.p.name")));
  const inp = el("input");
  inp.className = "pname-in";
  inp.type = "text";
  inp.value = pl.name;
  inp.maxLength = NAME_MAX;
  inp.placeholder = t("ui.p.namePh");
  inp.setAttribute("aria-label", t("ui.p.name"));
  nf.append(inp);
  const warn = el("p","pwarn", t("ui.p.nameRequired"));
  warn.hidden = pl.name.trim() !== "";
  nf.append(warn);
  inp.addEventListener("input", () => {
    pl.name = inp.value.slice(0, NAME_MAX);
    head.querySelector(".pn").textContent = pl.name.trim() || t("ui.p.unnamed");
    warn.hidden = pl.name.trim() !== "";
    savePlayers();
  });
  body.append(nf);

  /* ---- Flottentypen ---- */
  const ff = el("div","field");
  ff.append(el("span","lbl", t("ui.p.fleets")));
  const chips = el("div","chips");
  OPT_FLEETS.forEach(f => {
    const on = pl.fleets.includes(f);
    chips.append(btn("chip", icon(FLEETS[f].icon, FLEETS[f].color) + t("terms." + f), () => {
      pl.fleets = on ? pl.fleets.filter(x => x !== f)
                     : OPT_FLEETS.filter(x => x === f || pl.fleets.includes(x));
      savePlayers();
      renderProfiles();
    }, {"aria-pressed":String(on)}));
  });
  ff.append(chips);
  ff.append(el("p","pnote", t("ui.p.fleetsNote")));
  body.append(ff);

  /* ---- Technologien ----
     Auch Deep Space Missiles ist hier nur noch eine Zeile wie jede andere:
     das Profil kennt den Ausbaustand, nicht die Lage des Kampfsektors.    */
  const grp0 = el("div","pgroup");
  grp0.append(el("span","lbl", t("ui.p.techBoth")));
  TECH_GROUPS[0].keys.forEach(k => grp0.append(
    triRow(k, pl.tech[k], v => { pl.tech[k] = v; savePlayers(); renderProfiles(); })));
  grp0.append(el("p","pnote", t("ui.p.techNote")));
  body.append(grp0);

  TECH_GROUPS.slice(1).forEach(g => {
    /* Das Destroyer-Kampfplaettchen ist ohne Destroyer gegenstandslos. */
    const keys = g.keys.filter(k => k !== "destroyers" || pl.fleets.includes("destroyer"));
    const grp = el("div","pgroup");
    grp.append(el("span","lbl", t(g.label)));
    keys.forEach(k => grp.append(
      triRow(k, pl.tech[k], v => { pl.tech[k] = v; savePlayers(); renderProfiles(); })));
    if(g.keys.includes("destroyers") && !keys.includes("destroyers")){
      grp.append(el("p","pnote", t("ui.p.destroyerHint")));
    }
    body.append(grp);
  });

  body.append(btn("pdel", t("ui.p.delete"), () => deletePlayer(pl.id),
    {"aria-label":t("ui.p.deleteAria", {name: pl.name || t("ui.p.unnamed")})}));

  w.append(body);
  return w;
}

/* Ein geloeschtes Profil darf keiner Seite mehr zugeordnet bleiben. Die dort
   eingetragenen Werte bleiben unangetastet stehen.                          */
function deletePlayer(id){
  S.players = S.players.filter(p => p.id !== id);
  if(S.editing === id) S.editing = null;
  ["p","q"].forEach(s => {
    if(S.profile[s] === id){ S.profile[s] = null; applyProfile(s); }
  });
  savePlayers();
  renderProfiles(); bump();
}

/* ===========================================================================
   8 — MASKE 1 · TYPE
   Ein Tap navigiert direkt weiter. Kein Next-Button — der wuerde der
   Ein-Tap-Regel widersprechen.
   ======================================================================== */
$("#s1title").textContent = t("ui.t.title");
$("#s1sub").textContent   = t("ui.t.sub");
(function buildTypes(){
  const box = $("#typeBox");
  TYPES.forEach(k => {
    const m = TYPE_META[k];
    box.append(btn("type",
      `<span class="sig">${icon(m.icon, m.color)}</span>
       <span class="txt"><b>${t("ui.t." + k)}</b><small>${t("ui.t." + k + ".sub")}</small></span>
       <span class="go">›</span>`,
      () => setType(k), {"data-t":k}));
  });
})();

/* Typwechsel-Reset: nur wenn sich der Typ tatsaechlich aendert. Erneutes
   Antippen desselben Typs loescht nichts.                                    */
function setType(k){
  if(S.combatType !== k){
    S.combatType = k;
    S.data = {p:blank(), q:blank()};
    S.roles = (k === "skirmish") ? {inv:"q", def:"p"} : {inv:"p", def:"q"};
    S.profile = {p:null, q:null};   // neuer Kampf, moeglicherweise andere Teilnehmer
    applyProfile("p"); applyProfile("q");
  }
  $$(".type").forEach(x => x.classList.toggle("sel", x.dataset.t === k));
  go(2); bump();
}

/* Seitentausch: dreht Rollen und Kampftyp um, ruehrt die Daten nicht an. */
function swapSides(){
  if(!canSwap()) return;
  S.combatType = S.combatType === "pvv" ? "skirmish" : "pvv";
  S.roles = {inv:S.roles.def, def:S.roles.inv};
  $$(".type").forEach(x => x.classList.toggle("sel", x.dataset.t === S.combatType));
  renderConfig(); bump();
}

/* ===========================================================================
   9 — MASKE 2 · CONFIGURATION
   Invader ueber Defender auf dem Smartphone, ab 720 px nebeneinander (das
   macht allein das Stylesheet — der DOM ist in beiden Faellen derselbe).
   ======================================================================== */
$("#next2").innerHTML = t("ui.nav.next") + icon("i-arrow");
$("#next2").addEventListener("click", () => go(3));

function renderConfig(){
  const bar = $("#typebar");
  bar.innerHTML = "";
  bar.append(el("span","now", `<b>${t("ui.t." + S.combatType)}</b>`));
  if(canSwap()){
    bar.append(btn("swap", icon("i-swap") + t("ui.c.swap"), swapSides));
    bar.append(el("span","swaphint", t("ui.c.swapHint")));
  }
  const duo = $("#duo");
  duo.innerHTML = "";
  duo.append(sidePanel("inv"), sidePanel("def"));
}
/* Der Breakpoint braucht kein JS: die Reihenfolge im DOM ist Invader,
   Defender; flex-direction schaltet die Achse um. Deshalb entfaellt der
   resize-Listener aus Entwurf 2 vollstaendig. */

function sidePanel(role){
  const w = el("div", "side " + role);
  const head = el("div","sidehead");
  head.append(el("span","badge", roleName(role)));
  head.append(el("span","ctx", ctxText(role)));
  if(!isFallen(role)) head.append(el("span","tot", `${totalFP(role)}<small>${t("terms.fp")}</small>`));
  w.append(head);

  const body = el("div","sidebody");
  w.append(body);

  if(isFallen(role)){
    body.append(el("div","fixedside",
      `<div class="big">${t("ui.c.fallenBig")}</div>
       <span class="lbl">${t("ui.c.fallenLabel")}</span>
       <p>${t("ui.c.fallenBody")}</p>`));
    return w;
  }

  /* ---- Profil ---- */
  if(isPlayer(role)) body.append(profileBar(role));

  /* ---- Fleet Power ---- */
  const fc = el("div","card");
  fc.append(el("span","lbl", t("ui.c.fleetPower")));
  if(isVoidborn(role)){
    fc.append(unit(role, "voidborn"));
    fc.append(el("p","notice", S.combatType === "skirmish" && role === "inv"
      ? t("ui.c.skirmishNote") : t("ui.c.voidbornNote")));
  } else {
    S.shown[slotOf(role)].forEach(k => fc.append(unit(role, k)));
    /* Zur Wahl stehen immer alle Flottentypen, auch mit Profil. Das Profil
       waehlt vor, es sperrt nicht — genau wie bei den Technologien. Wer eine
       Krise, ein geliehenes Schiff oder schlicht ein unvollstaendiges Profil
       vor sich hat, muss den Typ trotzdem eintragen koennen.                */
    const rest = OPT_FLEETS.filter(f => !S.shown[slotOf(role)].includes(f));
    if(rest.length){
      const bar = el("div","attach");
      bar.append(el("span","lbl", t("ui.c.addType")));
      const row = el("div");
      row.style.cssText = "display:flex;flex-wrap:wrap;gap:8px";
      rest.forEach(f => {
        const b = btn("swap", icon("i-plus") + t("terms." + f), () => {
          S.shown[slotOf(role)].push(f); renderConfig();
        });
        row.append(b);
      });
      bar.append(row);
      fc.append(bar);
    }
  }
  body.append(fc);

  /* ---- Installationen (nur Defender) ---- */
  if(role === "def"){
    const ic = el("div","card");
    ic.append(el("span","lbl", t("ui.c.installations")));
    ic.append(unit(role,"sectorDefenses"));
    if(isPlayer(role)) ic.append(unit(role,"starbases"));
    body.append(ic);
  }

  /* ---- uebrige Technologien ---- */
  if(isPlayer(role)){
    const tc = el("div","card");
    tc.append(el("span","lbl", t("ui.c.gear")));
    tc.append(dsmBlock(role));
    if(role === "inv") tc.append(techRow(role,"drones"));
    if(role === "def") tc.append(techRow(role,"energy"));
    const adv = advanced(role);
    if(adv) tc.append(adv);
    body.append(tc);
  }
  return w;
}

/* Profil-Zuordnung per Buttons statt Select: ein Tap statt Menue oeffnen,
   waehlen, schliessen. Der zweite Tap auf das aktive Profil loest es wieder,
   deshalb braucht es keinen eigenen "kein Profil"-Eintrag.

   Die Leiste hat immer MAX_PLAYERS Plaetze, auch wenn weniger Profile
   angelegt sind: ein einzelner Name ueber die volle Breite sieht aus wie ein
   Aktionsbutton und nicht wie eine Auswahl. Die ueberzaehligen Plaetze sind
   deaktiviert und nur ein Platzhalterstrich.                                */
function profileBar(role){
  const slot = slotOf(role);
  const f = el("div","profbar");
  f.append(el("span","lbl", t("ui.c.profile")));
  if(!S.players.length){
    f.append(el("p","hint", t("ui.c.profileEmpty")));
    return f;
  }
  const row = el("div","pbtns");
  for(let i = 0; i < MAX_PLAYERS; i++){
    const pl = S.players[i];
    if(pl){
      row.append(btn("pbtn", esc(pl.name), () => setProfile(slot, pl.id),
        {"aria-pressed":String(S.profile[slot] === pl.id),
         "aria-label":t("ui.c.profileAria", {name: pl.name})}));
    } else {
      row.append(btn("pbtn empty", "—", () => {},
        {disabled:"", "aria-hidden":"true", tabindex:"-1"}));
    }
  }
  f.append(row);
  const cur = playerOf(slot);
  f.append(el("p","hint", cur ? t("ui.c.profileOn", {name: esc(cur.name)}) : t("ui.c.profileNone")));
  return f;
}

/* Der Profilname steht jetzt in der Leiste direkt darunter — im Kopf waere
   er doppelt. Die leere Spanne bleibt, sie haelt die Fleet Power rechts. */
function ctxText(role){
  if(isVoidborn(role)) return t("terms.voidborn");
  if(isFallen(role))   return t("terms.fallenHouse");
  return "";
}

/* ---------------------------------------------------------------------------
   Eine Einheit: Kopfzeile mit Wert und +/-, darunter die Schnellwahl ueber
   die volle Breite. Corvette und Voidborn bekommen sechs Buttons, alles
   andere drei. Das ist der eigentliche Umbau gegenueber Entwurf 2.
   ------------------------------------------------------------------------ */
function unitMeta(key){
  if(key === "voidborn")       return {label:t("terms.voidborn"),       icon:"i-voidborn",  color:"--fleet-voidborn", max:14, quick:[1,2,3,4,5,6]};
  if(key === "sectorDefenses") return {label:t("terms.sectorDefenses"), icon:"i-sd",        color:"--sector-defense", max:6,  quick:[1,2,3]};
  if(key === "starbases")      return {label:t("terms.starbases"),      icon:"i-starbase",  color:"--starbase",       max:2,  quick:[1,2]};
  return {label:t("terms." + key), icon:FLEETS[key].icon, color:FLEETS[key].color, max:14,
          quick: key === "corvette" ? [1,2,3,4,5,6] : [1,2,3]};
}

function unit(role, key){
  const m = unitMeta(key);
  const d = D(role);
  const v = d[key];
  const u = el("div", "unit" + (v === 0 ? " zero" : ""));

  const head = el("div","uhead",
    `<span class="fi">${icon(m.icon, m.color)}</span><span class="fn">${m.label}</span>`);

  /* Flottenzeile wieder ausblenden. Gilt auch mit Profil: das Profil sagt,
     was die Person aufstellen kann, nicht was sie diesmal mitbringt — ueber
     die Leiste "Add fleet type" kommt der Typ jederzeit zurueck. */
  if(FLEET_KEYS.includes(key) && key !== "corvette"){
    head.append(btn("rm","×", () => {
      d[key] = 0;
      S.shown[slotOf(role)] = S.shown[slotOf(role)].filter(x => x !== key);
      renderConfig(); bump();
    }, {"aria-label": t("ui.c.remove",{name:m.label})}));
  }

  head.append(el("span","uv num", String(v)));
  head.append(btn("pm","−", () => { d[key] = Math.max(0, v-1); renderConfig(); bump(); },
    {"aria-label": t("ui.c.dec",{name:m.label}), ...(v <= 0 ? {disabled:""} : {})}));
  head.append(btn("pm","+", () => { d[key] = Math.min(m.max, v+1); renderConfig(); bump(); },
    {"aria-label": t("ui.c.inc",{name:m.label}), ...(v >= m.max ? {disabled:""} : {})}));
  u.append(head);

  const q = el("div","quick");
  m.quick.forEach(n => q.append(btn(null, String(n),
    () => { d[key] = (v === n ? 0 : n); renderConfig(); bump(); },
    {"aria-pressed": String(v === n), "aria-label": t("ui.c.set",{name:m.label, n})})));
  u.append(q);

  /* Abhaengige Technologien haengen an der Zeile, zu der sie gehoeren. */
  if(key === "corvette"){
    const a = el("div","attach");
    a.append(el("span","lbl", v > 0 ? t("ui.c.corvetteUp") : t("ui.c.corvetteUpOff")));
    ["targeting","shields","torpedoes"].forEach(k => a.append(techRow(role,k)));
    if(v === 0) a.style.opacity = ".5";
    u.append(a);
  }
  if(key === "destroyer" && role === "inv" && v > 0){
    const a = el("div","attach");
    a.append(el("span","lbl", t("ui.c.destroyerTile")));
    a.append(techRow(role,"destroyers"));
    u.append(a);
  }
  return u;
}

/* ---- Technologie als explizites Dreier-Segment --------------------------
   Wertfrei gehalten, damit der Profil-Editor auf Maske 0 dieselben Zeilen
   benutzt wie die Aufstellung — sonst driften die beiden auseinander.      */
function triRow(key, cur, onPick, deviate){
  const spec = TECH[key];
  const w = el("div","tblock");
  const r = el("div", "trow" + (deviate ? " deviates" : ""));
  r.append(el("span","tn", t(spec.label)));
  const tri = el("div","tri");
  spec.states.forEach((lblKey,i) => {
    if(lblKey === null) return;
    tri.append(btn(null, t(lblKey), () => onPick(i),
      {"data-v":i, "aria-pressed":String(cur === i), "aria-label": t(spec.label) + ": " + t(lblKey)}));
  });
  r.append(tri);
  w.append(r);
  /* Der Erklaersatz steht an jeder Technologie und auf beiden Masken: eine
     Zeile Gedaechtnisstuetze, keine Regelwiedergabe.                       */
  if(spec.note) w.append(el("p","expl", t(spec.note)));
  return w;
}
function techRow(role, key){
  return triRow(key, D(role).tech[key],
    v => { D(role).tech[key] = v; renderConfig(); bump(); }, deviates(role, key));
}

/* ---- Deep Space Missiles: Stufe, darunter die Folgefrage -----------------
   Erst die Technologiezeile wie bei jeder anderen Technologie — sie sagt nur,
   ob und wie ausgebaut die Person sie besitzt. Ob sie in diesem Kampf etwas
   austeilt, haengt am Sektor und steht deshalb darunter:

     Basic     Angreifer: ein Schalter, ob eine benachbarte Shipyard oder
               Starbase da ist und dafuer 1 Energy ausgegeben wird.
               Verteidiger: gar nichts, Basic wirkt hier nicht.
     Improved  Zahl der benachbarten Sektoren mit Shipyard oder Starbase,
               beide Seiten, gedeckelt bei 2.
   ------------------------------------------------------------------------ */
function dsmBlock(role){
  const d = D(role), lvl = d.tech.dsm;
  const box = el("div","dsmbox");
  box.append(techRow(role,"dsm"));

  if(lvl === 1){
    if(role === "inv"){
      box.append(btn("switch sub",
        `<span class="tr"></span><span class="sl">${t("ui.c.dsmBasicUse")}</span>`,
        () => { d.dsmEnergy = !d.dsmEnergy; renderConfig(); bump(); },
        {"aria-pressed": String(!!d.dsmEnergy)}));
    } else {
      box.append(el("p","expl sub", t("ui.c.dsmDefBasic")));
    }
  }

  if(lvl === 2){
    const f = el("div","field sub");
    f.append(el("span","lbl", t("ui.c.dsmAdj")));
    const seg = el("div","seg");
    DSM_ADJ.forEach(n => {
      const lbl = n === 2 ? t("terms.adj2") : String(n);
      seg.append(btn(null, lbl, () => { d.dsmAdjacent = n; renderConfig(); bump(); },
        {"aria-pressed": String(d.dsmAdjacent === n),
         "aria-label": t("ui.c.dsmAdj") + ": " + lbl}));
    });
    f.append(seg);
    f.append(el("p","expl", t("ui.c.dsmAdjNote")));
    box.append(f);
  }
  return box;
}

/* ---- Advanced: nur was fuer die aktuelle Aufstellung ueberhaupt gilt ----- */
function advanced(role){
  if(role !== "inv") return null;
  const slot = slotOf(role), d = D(role);
  const det = el("details","adv");
  if(S.advOpen[slot]) det.setAttribute("open","");
  det.addEventListener("toggle", () => { S.advOpen[slot] = det.open; });
  det.append(el("summary", null, t("ui.c.advanced")));
  const box = el("div");

  if(d.tech.drones > 0){
    box.append(btn("switch", `<span class="tr"></span><span class="sl">${t("ui.c.trade")}</span>`,
      () => { d.returnTrade = !d.returnTrade; renderConfig(); bump(); },
      {"aria-pressed": String(!!d.returnTrade)}));
  }
  const f = el("div","field");
  f.append(el("span","lbl", t("ui.c.bombardLabel")));
  const seg = el("div","seg");
  [0,3,6,9].forEach(n => seg.append(btn(null, String(n),
    () => { d.bombard = n; renderConfig(); bump(); },
    {"aria-pressed": String(d.bombard === n)})));
  f.append(seg);
  f.append(el("p","expl", t("ui.c.bombardNote")));
  box.append(f);

  det.append(box);
  return det;
}

/* ===========================================================================
   10 — FLOATING-KURZERGEBNIS  (Platzhalter, KEIN Resolver)
   Bewusst simpler Summenvergleich der Fleet Power. Er kennt weder Sector
   Defenses noch Initiative noch Absorption.
   ======================================================================== */
function placeholderVerdict(){
  if(!S.combatType) return {kind:"na"};
  const i = totalFP("inv"), d = totalFP("def");
  if(i === 0 && d === 0) return {kind:"na"};
  if(i > d) return {kind:"inv", diff:i-d};
  if(d > i) return {kind:"def", diff:d-i};
  return {kind:"tie", diff:0};
}
function bump(){
  const v = placeholderVerdict();
  const who = $("#miniWho"), fp = $("#miniFp"), unitLbl = $("#miniUnit");
  who.className = "who " + (v.kind === "inv" ? "inv" : v.kind === "def" ? "def" : v.kind === "tie" ? "tie" : "na");
  if(v.kind === "na"){ who.textContent = "—"; fp.textContent = "–"; unitLbl.textContent = t("terms.fp"); }
  else if(v.kind === "tie"){ who.textContent = t("ui.mini.tie"); fp.textContent = "0"; unitLbl.textContent = t("terms.fp"); }
  else { who.textContent = t(v.kind === "inv" ? "terms.invader" : "terms.defender");
         fp.textContent = "+" + v.diff; unitLbl.textContent = t("terms.fp"); }
  $("#mini").setAttribute("aria-label", t("ui.mini.aria"));
  const m = $("#mini"); m.classList.remove("pulse"); void m.offsetWidth; m.classList.add("pulse");
  if(S.screen === 3) renderResult();
}

/* ===========================================================================
   11 — MASKE 3 · RESULT
   Zweigeteilt: Ergebnis oben, Kampflog darunter, Back + Reset unter beiden
   Bloecken. Alle Log-Steps per Default aufgeklappt.

   Zahlenblock und Log sind hartcodiert aus COMBAT-RULES.md §8. Das Urteil
   oben folgt dem Platzhalter-Summenvergleich, damit der Unentschieden-
   Hinweis ueberhaupt sichtbar werden kann — beides ist als Platzhalter
   ausgeschildert.
   ======================================================================== */
const LOG = [
  {name:["terms.approachStep",{}], inv:"4→3", def:"3→3", lines:[
    {pip:"dmg", key:"log.approach.sd",  p:{side:"@def", n:"<b>1</b>", dmg:"<b>1</b>"}},
    {pip:"abs", key:"log.approach.abs", p:{side:"@inv", n:"<b>0</b>"}},
    {pip:"res", key:"log.approach.res", p:{side:"@inv", n:"<b>1</b>", a:"@inv", from:"<b>4</b>", to:"<b>3</b>", b:"@def", stay:"<b>3</b>"}}
  ]},
  {name:["terms.salvoStep",{n:1}], inv:"3→3", def:"3→2", lines:[
    {pip:"ini", key:"log.salvo.simultaneous", p:{a:"<b>3</b>", b:"<b>3</b>"}},
    {pip:"dmg", key:"log.salvo.each",   p:{n:"<b>1</b>"}},
    {pip:"abs", key:"log.salvo.absorb", p:{side:"@inv", n:"<b>1</b>"}},
    {pip:"res", key:"log.res",          p:{a:"@inv", i:"<b>3</b>", b:"@def", d:"<b>3 → 2</b>"}}
  ]},
  {name:["terms.salvoStep",{n:2}], inv:"3→2", def:"2→1", lines:[
    {pip:"ini", key:"log.salvo.first",  p:{a:"<b>3</b>", b:"<b>2</b>", side:"@inv"}},
    {pip:"dmg", key:"log.salvo.recall", p:{side:"@def", n:"<b>1</b>", from:"<b>2</b>", to:"<b>1</b>"}},
    {pip:"ini", key:"log.salvo.recalc", p:{side:"@def", n:"<b>1</b>"}},
    {pip:"res", key:"log.res",          p:{a:"@inv", i:"<b>3 → 2</b>", b:"@def", d:"<b>1</b>"}}
  ]},
  {name:["terms.salvoStep",{n:3}], inv:"2→2", def:"1→0", lines:[
    {pip:"ini", key:"log.salvo.first",      p:{a:"<b>2</b>", b:"<b>1</b>", side:"@inv"}},
    {pip:"dmg", key:"log.salvo.recallLast", p:{side:"@def", from:"<b>1</b>", to:"<b>0</b>"}},
    {pip:"ini", key:"log.salvo.zero",       p:{side:"@def", n:"<b>0</b>"}},
    {pip:"res", key:"log.resEnd",           p:{a:"@inv", i:"<b>2</b>", b:"@def", d:"<b>0</b>"}}
  ]}
];
function fill(p){
  const out = {};
  for(const k in p){
    const v = p[k];
    out[k] = v === "@inv" ? t("terms.invader") : v === "@def" ? t("terms.defender") : v;
  }
  return out;
}

function renderResult(){
  const box = $("#resultBox");
  box.innerHTML = "";
  const v = placeholderVerdict();

  /* --- Urteil --- */
  const verdict = el("div","verdict " + (v.kind === "tie" ? "tie" : v.kind === "na" ? "na" : "win"));
  if(v.kind === "na"){
    verdict.append(el("div","who", t("ui.r.empty")));
    verdict.append(el("h2", null, "—"));
    verdict.append(el("div","rem", t("ui.r.emptyBody")));
  } else if(v.kind === "tie"){
    verdict.append(el("div","who", t("ui.r.tieHead")));
    verdict.append(el("h2", null, t("ui.r.tieTitle")));
    verdict.append(el("div","rem", `${t("ui.r.remaining")} <b>0</b> ${t("terms.fp")}`));
  } else {
    const side = v.kind === "inv" ? t("terms.invader") : t("terms.defender");
    verdict.append(el("div","who", t("ui.r.victory",{side})));
    verdict.append(el("h2", null, t(v.kind === "inv" ? "ui.r.sectorTaken" : "ui.r.sectorHeld")));
    verdict.append(el("div","rem", `${t("ui.r.remaining")} <b>${v.diff}</b> ${t("terms.fp")}`));
  }
  verdict.append(el("p","pnote", t("ui.r.verdictNote")));
  box.append(verdict);

  /* --- Unentschieden-Hinweis --- */
  if(v.kind === "tie"){
    box.append(el("div","tiehint", icon("i-tie") + "<span>" + t("ui.r.tieHint") + "</span>"));
  }

  /* --- hartcodierter Zahlenblock aus §8 --- */
  const bars = el("div","fpbars");
  bars.append(el("div","fpbar inv",
    `<span class="lbl">${t("terms.invader")}</span><div class="v">2</div>
     <div class="d">${t("ui.r.lost",{from:4,to:2,n:2})}</div>`));
  bars.append(el("div","fpbar def",
    `<span class="lbl">${t("terms.defender")}</span><div class="v">0</div>
     <div class="d">${t("ui.r.wiped",{from:3,to:0})}</div>`));
  box.append(bars);
  box.append(el("p","notice", t("ui.r.notice")));
  box.append(navPair());

  /* --- Kampflog, alle Steps aufgeklappt --- */
  const log = el("div","log");
  log.append(el("h3", null, t("ui.r.logTitle")));
  LOG.forEach(step => {
    const d = el("details","step");
    d.setAttribute("open","");
    d.append(el("summary", null,
      `<span class="chev">›</span><span class="sname">${t(step.name[0], step.name[1])}</span>
       <span class="sfp"><span class="i">${step.inv}</span><span class="sep">·</span><span class="d">${step.def}</span></span>`));
    const body = el("div","body");
    const calc = el("div","calc");
    step.lines.forEach(l => calc.append(el("div","line",
      `<i class="pip ${l.pip}"></i><span>${t(l.key, fill(l.p))}</span>`)));
    body.append(calc);
    d.append(body);
    log.append(d);
  });
  box.append(log);
  box.append(navPair());
}

/* Back + Reset. Bewusst zweimal auf der Maske — einmal unter dem Ergebnis,
   einmal unter dem Log, damit man nach dem Lesen nicht hochscrollen muss. */
function navPair(){
  const row = el("div","navrow inflow");
  row.append(btn("btn btn-back", icon("i-back") + t("ui.nav.back"), () => go(2)));
  row.append(btn("btn btn-reset", icon("i-reset") + t("ui.nav.reset"), askReset));
  return row;
}

/* ===========================================================================
   12 — RUECKFRAGE-DIALOG  ·  RESET
   Ein Dialog fuer zwei Faelle: das Zurücksetzen des Kampfes und das Loeschen
   aller Profile. Beide sind nicht umkehrbar, beide fragen deshalb nach.
   ======================================================================== */
$("#btnReset").setAttribute("aria-label", t("ui.reset.aria"));
$("#dlgCancel").textContent = t("ui.reset.cancel");

let dlgAction = null;
function askConfirm(title, body, okLabel, action){
  $("#dlgTitle").textContent = title;
  $("#dlgBody").textContent  = body;
  $("#dlgOk").textContent    = okLabel;
  dlgAction = action;
  $("#scrim").classList.add("on");
  $("#dlgCancel").focus();
}
function closeDialog(){ $("#scrim").classList.remove("on"); dlgAction = null; }
function askReset(){
  askConfirm(t("ui.reset.title"), t("ui.reset.body"), t("ui.reset.confirm"), doReset);
}
$("#btnReset").addEventListener("click", askReset);
$("#dlgCancel").addEventListener("click", closeDialog);
$("#scrim").addEventListener("click", e => { if(e.target === $("#scrim")) closeDialog(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeDialog(); });
$("#dlgOk").addEventListener("click", () => {
  const a = dlgAction;
  closeDialog();
  if(a) a();
});

/* Der Reset raeumt den Kampf ab. Die Profile selbst bleiben — sie sind
   Stammdaten und haben einen eigenen Loeschbutton auf Maske 0. Die
   Zuordnung faellt dagegen weg, sie gehoert zum Kampf.                      */
function doReset(){
  S.combatType = null;
  S.data    = {p:blank(), q:blank()};
  S.roles   = {inv:"p", def:"q"};
  S.profile = {p:null, q:null};
  S.advOpen = {p:false, q:false};
  S.shown   = {p:["corvette"], q:["corvette"]};
  $$(".type").forEach(x => x.classList.remove("sel"));
  go(1); bump();
}

/* ===========================================================================
   13 — START
   ======================================================================== */
S.players = loadPlayers();
applyProfile("p"); applyProfile("q");
go(1);
bump();

/* Nur fuer das Geometrie-Audit: erlaubt einem Testskript, den Zustand
   deterministisch zurueckzusetzen, weil der Preview-Pane den JS-Kontext
   ueber location.reload() hinweg behaelt. */
window.__vf = {S, go, setType, swapSides, doReset, renderConfig, renderProfiles,
               setProfile, savePlayers, loadPlayers, bump};
</script>
